name: Security

on:
  workflow_call:
    inputs:
      team:
        required: false
        type: string
        description: 'Ikke i bruk'
        default: 'okonomi'
      language:
        required: true
        type: string
        description: 'Programming language to analyze (eg: java or javascript)'
      image-suffix:
        required: false
        type: string
        default: ''
        description: 'Ikke i bruk'
      use-reader-token:
        required: false
        type: boolean
        default: false
        description: 'Tillater Gradle å hente private dependencies fra Github Packages'

env:
  # Støtte for Gradle-prosjekter som har "val githubPassword: String by project" for å kunne hente private
  # dependencies fra GAR; fordrer at prosjekt-workflowen som kaller denne delte workflowen sender videre GITHUB_TOKEN
  # (f.eks. med "secrets: inherit")
  ORG_GRADLE_PROJECT_githubPassword: ${{ inputs.use-reader-token && secrets.READER_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  security-analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: ${{ inputs.language }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
